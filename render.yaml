# (rootDir apunta a la carpeta). Si bot-core es su propio repo, borra la línea rootDir.
services:
  - type: web
    name: bot-core
    runtime: docker
    rootDir: bot-core
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: BOT_PROJECTS
        value: mastertech,citas
      - key: BOT_POOL_MAX
        value: "3"                      # conexiones por proyecto (2 proyectos x 3 = 6)
      # --- compartido ---
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_DATABASE_URL           # BD comun (esquema "bot"). Un proyecto puede usar otra con <PROYECTO>_DATABASE_URL
        sync: false
      # --- Master Tech ---
      - key: MASTERTECH_JWT_SECRET      # = JWT_SECRET del backend de Master Tech
        sync: false
      - key: MASTERTECH_API_URL         # URL pública del backend Spring de Master Tech (https://...onrender.com)
        sync: false
      - key: MASTERTECH_CORS_ORIGINS    # URL del frontend de Master Tech
        sync: false
      # --- Citas ---
      - key: CITAS_JWT_SECRET           # = secreto con que firma el backend de citas
        sync: false
      - key: CITAS_API_URL              # URL pública del backend de citas
        sync: false
      - key: CITAS_CORS_ORIGINS         # URL del frontend de citas
        sync: false
